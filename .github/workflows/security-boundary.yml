name: Security boundary

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: >-
          python -m pytest
          tests/test_api_security.py
          tests/test_private_storage.py
          tests/test_camera_handler.py
          tests/test_face_detection.py

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - name: Ensure live screenshot capture is refused
        run: if npm run capture-screenshots; then exit 1; fi
